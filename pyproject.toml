[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redblockblue-animation"
version = "0.1.0"
description = "A semantic procedural-animation DSL and component framework on top of Manim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["manim>=0.19,<0.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
